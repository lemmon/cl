name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install runtime dependencies
        # Resolve fresh per PHP version, runtime only. The dev tooling
        # (PHPUnit ^13) requires PHP 8.4+, so it is intentionally excluded
        # here. This still verifies the runtime constraint
        # (symfony/var-dumper ^6.0 || ^7.0) is satisfiable across the whole
        # supported range, e.g. ^6 on 8.1 and ^7 on 8.2+.
        run: composer update --no-dev --prefer-dist --no-progress --no-interaction

      - name: Smoke test
        # Exercise the actual cl() code path (including the multi-argument
        # label branch) against the resolved var-dumper version.
        run: php -r 'require "vendor/autoload.php"; cl(["ci" => true], 42);'
